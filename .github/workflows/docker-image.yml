name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Set up GitHub Actions
        run: /
          echo "REPO=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - run: /
          echo "repo ${REPO}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set uo QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3      
        with:
          registry: ghcr.io
          username: ${{ github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

# Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
            context: '{{defaultContext}}:backend'
            push: true
            tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-backend:latest'
  # frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
            context: '{{defaultContext}}:frontend'
            push: true
            tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-frontend:latest' 
  # njinx
      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
            context: '{{defaultContext}}:nginx'
            push: true
            tags: 'ghcr.io/${{ env.REPO }}/film-react-nest-server:latest   