server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lazer.ionela.nomorepartiessbs.ru;

    root /var/www;
    index intel.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /api/afisha/ {
        # Если бэкенд реально экспонирует /api/afisha — оставляем так:
        proxy_pass http://backend:3000;

        # Если бэкенд ждёт корень (/), то включи переписание:
        # rewrite ^/api/afisha/?(.*)$ /$1 break;
        # proxy_pass http://backend:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- CDN локально на диске (опционально) ---
    location /content/afisha/ {
        alias /var/www/content/afisha/;
        access_log off;
        expires 30d;
        etag on;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Быстрый кэш ассетов
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        etag on;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}